<!doctype html>
<!-- Story image template (W5). Render: tools/render-images.sh -> share/<type>.png (1080x1920). -->
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=DM+Sans:wght@700&display=block">
<style>
  body{ margin:0; width:1080px; height:1920px; overflow:hidden; background:#0E1714; color:#F4EFE6; font-family:"DM Sans",sans-serif; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .logo{ margin-top:250px; display:flex; align-items:center; gap:24px; font:800 54px "Bricolage Grotesque"; letter-spacing:-.02em; }
  .tile{ width:100px; height:100px; border-radius:28px;  display:grid; place-items:center; line-height:0}
  .stamp{ margin-top:130px; width:600px; height:600px; border-radius:50%; border:10px dashed #F2A93B; box-shadow:inset 0 0 0 22px #0E1714, inset 0 0 0 29px #F2A93B; display:grid; place-content:center; gap:22px; transform:rotate(-10deg); color:#F2A93B; font-family:"Bricolage Grotesque"; font-weight:800; }
  .stamp span{ font-size:34px; letter-spacing:.16em; }
  .stamp strong{ font-size:66px; line-height:1; letter-spacing:.01em; }
  h1{ margin:120px 80px 0; font:800 104px/1 "Bricolage Grotesque"; letter-spacing:-.035em; }
  h1 em{ font-style:normal; color:#F2A93B; }
  .q{ margin-top:36px; font-size:58px; color:#C9D1CD; }
  .url{ position:absolute; bottom:250px; font-size:40px; color:#A8B3AE; letter-spacing:.02em; }
</style>
<div class="logo"><span class="tile"><svg width="100" height="100" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="t-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8EA8FA"/><stop offset="1" stop-color="#D6E0FF"/></linearGradient><clipPath id="t-clip"><rect width="100" height="100" rx="22.5"/></clipPath></defs><g clip-path="url(#t-clip)"><rect width="100" height="100" fill="url(#t-sky)"/><rect x="58" y="16" width="30" height="9" rx="4.5" fill="#FFFFFF" opacity=".55"/><g transform="translate(8 6) scale(0.35)"><path d="M56 166Q40 176 36 192" fill="none" stroke="#E8992C" stroke-width="14" stroke-linecap="round"/><path d="M184 166Q200 176 204 192" fill="none" stroke="#E8992C" stroke-width="14" stroke-linecap="round"/><defs><linearGradient id="t-pip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE3A3"/><stop offset=".55" stop-color="#FFD98A"/><stop offset="1" stop-color="#F2A93B"/></linearGradient></defs><ellipse cx="106" cy="246" rx="14" ry="7.5" fill="#EE6C4D"/><ellipse cx="134" cy="246" rx="14" ry="7.5" fill="#EE6C4D"/><path d="M120 240C84 224 46 186 46 138A74 74 0 0 1 194 138C194 186 156 224 120 240Z" fill="url(#t-pip)" stroke="#E08A2E" stroke-width="3"/><ellipse cx="86" cy="104" rx="17" ry="10" fill="#FFFFFF" opacity=".5" transform="rotate(-32 86 104)"/><ellipse cx="80" cy="168" rx="11" ry="6.5" fill="#EE6C4D" opacity=".5"/><ellipse cx="160" cy="168" rx="11" ry="6.5" fill="#EE6C4D" opacity=".5"/><path d="M84 72Q120 22 158 68Z" fill="#EE6C4D"/><ellipse cx="121" cy="70" rx="54" ry="10" fill="#EE6C4D" transform="rotate(-6 121 70)"/><path d="M88 65Q121 54 154 62" fill="none" stroke="#FFD98A" stroke-width="6" stroke-linecap="round"/><ellipse cx="100" cy="146" rx="10.5" ry="13" fill="#13201C"/><ellipse cx="140" cy="146" rx="10.5" ry="13" fill="#13201C"/><circle cx="104" cy="141" r="4" fill="#FFFFFF"/><circle cx="144" cy="141" r="4" fill="#FFFFFF"/><circle cx="97" cy="151" r="1.8" fill="#FFFFFF"/><circle cx="137" cy="151" r="1.8" fill="#FFFFFF"/><path d="M110 165Q120 175 130 165" fill="none" stroke="#13201C" stroke-width="4" stroke-linecap="round"/></g></g></svg></span>Go To Travel</div>
<div class="stamp"><span>GO TO TRAVEL</span><strong id="stampType"></strong><span>2026</span></div>
<h1 id="line"></h1>
<p class="q">What are you?</p>
<p class="url">gototravelapp.com</p>
<script>
  const t = new URLSearchParams(location.search).get('type') || 'Explorer';
  document.getElementById('stampType').textContent = t.toUpperCase();
  document.getElementById('line').innerHTML = `I'm ${/^[aeiou]/i.test(t) ? 'an' : 'a'} <em>${t}</em> traveler.`;
</script>
