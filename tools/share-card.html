<!doctype html>
<!-- Story image template (W5). Render: tools/render-images.sh -> share/<type>.png (1080x1920). -->
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=DM+Sans:wght@700&display=block">
<style>
  body{ margin:0; width:1080px; height:1920px; overflow:hidden; background:#0E1714; color:#F4EFE6; font-family:"DM Sans",sans-serif; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .logo{ margin-top:250px; display:flex; align-items:center; gap:24px; font:800 54px "Bricolage Grotesque"; letter-spacing:-.02em; }
  .tile{ width:100px; height:100px; border-radius:28px; background:#52927A; display:grid; place-items:center; }
  .stamp{ margin-top:130px; width:600px; height:600px; border-radius:50%; border:10px dashed #F2A93B; box-shadow:inset 0 0 0 22px #0E1714, inset 0 0 0 29px #F2A93B; display:grid; place-content:center; gap:22px; transform:rotate(-10deg); color:#F2A93B; font-family:"Bricolage Grotesque"; font-weight:800; }
  .stamp span{ font-size:34px; letter-spacing:.16em; }
  .stamp strong{ font-size:66px; line-height:1; letter-spacing:.01em; }
  h1{ margin:120px 80px 0; font:800 104px/1 "Bricolage Grotesque"; letter-spacing:-.035em; }
  h1 em{ font-style:normal; color:#F2A93B; }
  .q{ margin-top:36px; font-size:58px; color:#C9D1CD; }
  .url{ position:absolute; bottom:250px; font-size:40px; color:#A8B3AE; letter-spacing:.02em; }
</style>
<div class="logo"><span class="tile"><svg width="68" height="68" viewBox="0 0 48 48" fill="none" stroke="#fff"><circle cx="24" cy="24" r="17" stroke-width="2"/><ellipse cx="24" cy="24" rx="7" ry="17" stroke-width="1.6"/><path d="M7 24h34M9.5 15h29M9.5 33h29" stroke-width="1.5"/><path d="M15 30 Q24 16 33 21" stroke-width="2.2" stroke-linecap="round"/><circle cx="15" cy="30" r="2.4" fill="#fff"/><circle cx="33" cy="21" r="2.4" fill="#fff"/></svg></span>Go To Travel</div>
<div class="stamp"><span>GO TO TRAVEL</span><strong id="stampType"></strong><span>2026</span></div>
<h1 id="line"></h1>
<p class="q">What are you?</p>
<p class="url">gototravelapp.com</p>
<script>
  const t = new URLSearchParams(location.search).get('type') || 'Explorer';
  document.getElementById('stampType').textContent = t.toUpperCase();
  document.getElementById('line').innerHTML = `I'm ${/^[aeiou]/i.test(t) ? 'an' : 'a'} <em>${t}</em> traveler.`;
</script>
